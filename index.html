<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Forma — фитнес для мужчин</title>
<meta name="description" content="Персональные тренировки для похудения и набора массы: зал, дом, дорога, офис, пробежка.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forma">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--text:#000;--sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--bar:rgba(249,249,249,.82);
  --blue:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--pink:#FF2D55;--purple:#AF52DE;
  --teal:#30B0C7;--indigo:#5856D6;--yellow:#FFCC00;
  --move:#FA114F;--exer:#7ED321;--stand:#00C7DC;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--text:#fff;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24);--bar:rgba(18,18,18,.82);
  --blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--pink:#FF375F;--purple:#BF5AF2;
  --teal:#40C8E0;--indigo:#5E5CE6;--yellow:#FFD60A;--move:#FA114F;--exer:#A6FF00;--stand:#00F0FF;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.3;letter-spacing:-.41px}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.view{padding-top:calc(var(--st) + 12px);padding-bottom:calc(110px + var(--sb));min-height:100vh}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 4px 10px}
.date{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:-.08px}
h1{font-size:34px;font-weight:700;letter-spacing:.37px;line-height:41px}
h2{font-size:22px;font-weight:700;letter-spacing:.35px;margin:26px 4px 10px}
h3{font-size:17px;font-weight:600}
.sec{color:var(--sec)}.small{font-size:13px;letter-spacing:-.08px}.foot{font-size:15px;letter-spacing:-.24px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#8E8E93,#636366);color:#fff;font-weight:600;display:grid;place-items:center;font-size:15px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.card.tap{transition:transform .15s}.card.tap:active,.tile:active,.qcard:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;background:var(--fill);font-size:15px;font-weight:500;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 4px 6px;margin:0 -16px;padding-left:20px;padding-right:20px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:100px;background:var(--card);font-size:15px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.chip.on{background:var(--text);color:var(--bg)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;transition:opacity .15s,transform .15s}
.btn:active{opacity:.8;transform:scale(.98)}
.btn.gray{background:var(--fill);color:var(--blue)}
.btn.red{background:var(--fill);color:var(--red)}
.btn.green{background:var(--green);color:#000}
.btn.white{background:#fff;color:#000}
.link{color:var(--blue);font-weight:400}
/* grouped list */
.list{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:8px}
.li{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;position:relative;width:100%;text-align:left}
.li+.li::before{content:"";position:absolute;top:0;left:60px;right:0;height:.5px;background:var(--sep)}
.list.plain .li+.li::before{left:16px}
.li .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:17px;flex:none;color:#fff}
.li .body{flex:1;min-width:0}
.li .t{font-size:17px}.li .s{font-size:13px;color:var(--sec);margin-top:2px}
.li .v{color:var(--sec);font-size:17px;text-align:right}
.chev{width:8px;height:14px;flex:none;opacity:.35}
.li:active{background:var(--fill)}
.li input,.li select{background:transparent;border:0;text-align:right;color:var(--sec);font-size:17px;outline:none;max-width:55%;-webkit-appearance:none;appearance:none}
.li select{direction:rtl;padding-right:2px}
.li input:focus{color:var(--blue)}
.lbl{font-size:13px;color:var(--sec);text-transform:uppercase;margin:22px 16px 7px;letter-spacing:-.08px}
.note{font-size:13px;color:var(--sec);margin:0 16px 8px}
/* hero */
.hero{border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden;margin-bottom:12px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .k{font-size:13px;font-weight:600;text-transform:uppercase;opacity:.85}
.hero .ttl{font-size:28px;font-weight:700;letter-spacing:.36px;line-height:1.15;margin:4px 0 6px}
.hero .meta{display:flex;gap:16px;font-size:15px;opacity:.95;flex-wrap:wrap}
.hero .go{margin-top:18px;background:rgba(255,255,255,.95);color:#000;height:46px;border-radius:100px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;z-index:1}
.g-blue{background:linear-gradient(140deg,#0A84FF 0%,#5E5CE6 100%)}
.g-green{background:linear-gradient(140deg,#30D158 0%,#00A5A8 100%)}
.g-red{background:linear-gradient(140deg,#FF375F 0%,#FF9F0A 100%)}
.g-purple{background:linear-gradient(140deg,#BF5AF2 0%,#5E5CE6 100%)}
.g-dark{background:linear-gradient(140deg,#2C2C2E 0%,#1C1C1E 100%)}
.g-orange{background:linear-gradient(140deg,#FF9F0A 0%,#FF453A 100%)}
.g-teal{background:linear-gradient(140deg,#40C8E0 0%,#0A84FF 100%)}
/* rings */
.rings{display:flex;align-items:center;gap:18px}
.rings svg{flex:none}
.rstat .n{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.35px}
.rstat .u{font-size:15px;font-weight:600}
.rstat .lab{font-size:15px;font-weight:600}
.rstat+.rstat{margin-top:6px}
/* quick */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.qcard{flex:none;width:156px;height:180px;border-radius:20px;padding:14px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;text-align:left;transition:transform .15s}
.qcard .e{font-size:32px}
.qcard .t{font-size:17px;font-weight:700;line-height:1.15}
.qcard .s{font-size:13px;opacity:.9;margin-top:4px}
/* tiles */
.tile{background:var(--card);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:18px;transition:transform .15s}
.tile .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px}
.tile .t{font-size:17px;font-weight:600}.tile .s{font-size:13px;color:var(--sec);margin-top:2px}
/* macro */
.macro{display:flex;flex-direction:column;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.big{font-size:34px;font-weight:700;letter-spacing:.37px;font-variant-numeric:tabular-nums}
.mid{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .n{font-size:26px;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.36px}
.stat .l{font-size:13px;color:var(--sec);font-weight:500}
/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:13px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}
/* search */
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:36px;padding:0 8px;margin:0 0 12px}
.search input{flex:1;background:none;border:0;outline:none;font-size:17px}
.search svg{opacity:.5;flex:none}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:var(--sb)}
.tabbar .in{max-width:680px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;color:#999;font-size:10px;font-weight:500;letter-spacing:.1px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--blue)}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:680px;margin:0 auto;background:var(--bg);border-radius:14px 14px 0 0;max-height:94vh;overflow-y:auto;transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.72,0,1);padding-bottom:calc(24px + var(--sb))}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--ter);margin:6px auto 0}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;position:sticky;top:0;background:var(--bg);z-index:2}
.sheet .sh h3{font-size:17px;font-weight:600}
.xbtn{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--sec);font-size:15px;font-weight:700}
.sbody{padding:4px 16px 0}
.exhero{border-radius:20px;height:170px;display:grid;place-items:center;font-size:76px;margin-bottom:14px;position:relative;overflow:hidden}
.steps{counter-reset:s}
.steps li{list-style:none;display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:14px;font-weight:600;display:grid;place-items:center}
.tag{display:inline-block;font-size:13px;font-weight:500;padding:4px 10px;border-radius:100px;background:var(--fill);margin:0 6px 6px 0}
.dots{display:inline-flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ter)}.dots i.on{background:var(--orange)}
/* alert dialog */
.alert{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.alert.on{opacity:1;pointer-events:auto}
.alert .box{width:270px;border-radius:14px;background:var(--bar);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);text-align:center;overflow:hidden;transform:scale(1.1);transition:transform .2s}
.alert.on .box{transform:none}
.alert .bt{padding:19px 16px 16px}.alert .bt b{font-size:17px;font-weight:600;display:block;margin-bottom:4px}.alert .bt p{font-size:13px}
.alert .ab{display:block;width:100%;height:44px;border-top:.5px solid var(--sep);color:var(--blue);font-size:17px}
.alert .ab.b{font-weight:600}.alert .ab.r{color:var(--red)}
/* player */
.player{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s cubic-bezier(.32,.72,0,1);padding:calc(var(--st) + 10px) 20px calc(var(--sb) + 20px)}
.player.on{transform:none}
.player .top{display:flex;align-items:center;justify-content:space-between;max-width:640px;width:100%;margin:0 auto}
.player .clock{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:#A6FF00}
.pbar{display:flex;gap:3px;margin:14px auto 0;max-width:640px;width:100%}
.pbar i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.pbar i.d{background:#A6FF00}.pbar i.c{background:#fff}
.pmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:640px;width:100%;margin:0 auto;gap:6px}
.pmain .k{font-size:15px;font-weight:600;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.2px}
.pmain .nm{font-size:30px;font-weight:700;letter-spacing:.36px;line-height:1.15}
.pmain .huge{font-size:76px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.pring{position:relative;width:240px;height:240px;margin:16px 0}
.pring svg{transform:rotate(-90deg)}
.pring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pemoji{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:58px;margin:12px 0}
.pctrl{display:flex;gap:12px;max-width:640px;width:100%;margin:0 auto}
.pctrl .btn{border-radius:100px;height:56px}
.pbtn2{background:rgba(255,255,255,.14)!important;color:#fff!important}
.ptip{font-size:15px;color:rgba(255,255,255,.65);max-width:420px}
.pgo{background:#A6FF00!important;color:#000!important}
/* onboarding */
.onb{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;padding:calc(var(--st) + 16px) 0 calc(var(--sb) + 24px)}
.onb .wrap{min-height:100%;display:flex;flex-direction:column}
.onb .prog{display:flex;gap:4px;margin:6px 0 24px}
.onb .prog i{flex:1;height:4px;border-radius:2px;background:var(--fill)}.onb .prog i.on{background:var(--blue)}
.opt{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px;width:100%;text-align:left;border:2px solid transparent;transition:border-color .15s,transform .15s}
.opt:active{transform:scale(.98)}
.opt.on{border-color:var(--blue)}
.opt .e{font-size:30px;width:44px;text-align:center;flex:none}
.opt .t{font-size:17px;font-weight:600}.opt .s{font-size:15px;color:var(--sec);margin-top:2px}
.opt .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--ter);flex:none;display:grid;place-items:center}
.opt.on .ck{background:var(--blue);border-color:var(--blue)}
.opt.on .ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:12px 16px;margin-bottom:10px}
.stepper .val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stepper .ctr{display:flex;background:var(--fill);border-radius:9px}
.stepper .ctr button{width:46px;height:34px;font-size:22px;font-weight:400;color:var(--text)}
.stepper .ctr button+button{border-left:.5px solid var(--sep)}
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center;gap:14px;padding:30px 0}
.logo{width:110px;height:110px;border-radius:26px;background:#000;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.feat{display:flex;gap:14px;text-align:left;align-items:flex-start;max-width:400px}
.feat .e{font-size:28px;width:40px;flex:none;text-align:center}
.spacer{flex:1}
.empty{text-align:center;padding:30px 16px;color:var(--sec)}
.bodyart{display:inline-block;flex:none;border-radius:24%;overflow:hidden;vertical-align:top}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translate(-50%,-150%);background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 18px;border-radius:100px;font-size:15px;font-weight:600;z-index:80;transition:transform .35s cubic-bezier(.32,.72,0,1);box-shadow:0 6px 24px rgba(0,0,0,.15)}
.toast.on{transform:translate(-50%,0)}
.chart{width:100%;height:170px;display:block}
.wday{display:flex;gap:6px;justify-content:space-between;margin-top:14px}
.wday div{flex:1;text-align:center;font-size:12px;color:var(--sec);font-weight:600}
.wday div b{display:block;margin:6px auto 0;width:30px;height:30px;border-radius:50%;background:var(--fill)}
.wday div b.on{background:var(--exer)}
.wday div.today{color:var(--text)}
/* club */
.field{display:block;width:100%;background:var(--card);border:0;border-radius:12px;padding:13px 16px;font-size:17px;outline:none;margin-bottom:10px;color:var(--text)}
textarea.field{min-height:110px;resize:vertical;font-family:inherit;line-height:1.35}
.stars{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}
.stars button{font-size:36px;filter:grayscale(1);opacity:.3;transition:transform .15s}
.stars button.on{filter:none;opacity:1}
.stars button:active{transform:scale(1.2)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:22px;flex:none}
.ava.lg{width:64px;height:64px;font-size:36px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:100px;background:var(--fill);white-space:nowrap}
.rank{width:26px;text-align:center;font-weight:700;color:var(--sec);font-variant-numeric:tabular-nums;flex:none}
.li.me{background:color-mix(in srgb,var(--blue) 13%,transparent)}
.mini{height:32px;padding:0 14px;border-radius:100px;font-size:15px;font-weight:600;background:var(--blue);color:#fff;flex:none;white-space:nowrap}
.mini.gray{background:var(--fill);color:var(--blue)}
.mini.red{background:var(--fill);color:var(--red)}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:26px;font-weight:700;letter-spacing:3px}
.radar{display:block;margin:0 auto;max-width:320px;width:100%}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;background:var(--card);border-radius:12px;margin-bottom:10px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin-top:1px}
.betc{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.pp{display:flex;align-items:center;gap:10px;margin-top:10px}
.pp .ava{width:32px;height:32px;font-size:17px}
.seg.five button{font-size:12px;padding:0 2px}
.lock{opacity:.55}
.qcard{position:relative}.qcard .lk{position:absolute;top:12px;right:12px;font-size:16px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="player" id="player"></div>
<div class="alert" id="alert"></div>
<div class="toast" id="toast"></div>
<div id="onbHost"></div>

<script src="config.js"></script>
<script>
'use strict';
/* ============ STORAGE ============ */
const store={
  get(k,d){try{const v=localStorage.getItem('forma.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('forma.'+k,JSON.stringify(v))}catch(e){}}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ DATA ============ */

const ageGroup=a=>a<30?0:a<45?1:a<60?2:3;

function shuffle(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function allowed(e,p){
  const ag=ageGroup(p.age);
  if(ag===3&&(e.imp||e.lv>=3))return false;
  if(ag===2&&e.imp&&p.level<2)return false;

  if(p.goal==='lose'){reps=p.form==='competition'?'10–15':'12–20';rest-=20}
  if(p.goal==='gain')rest+=15;
  if(p.level===1)sets=Math.max(2,sets-1);
  const ag=ageGroup(p.age);
  if(ag>=2){sets=Math.max(2,sets-1);rest+=15;if(p.form!=='athletic')reps='10–15'}
  if(p.body==='ecto'){rest+=15;if(p.goal!=='lose'&&p.form!=='athletic')reps='6–10'}

function genWorkout(day,idx,loc,p){

  day.m.forEach((m,i)=>{
    let pool=EX.filter(e=>e.m===m&&e.l.includes(loc)&&allowed(e,p)&&!used.has(e.id));
    pool=shuffle(pool,weekSeed()*31+idx*7+i);
    if(m==='cardio'&&loc==='g')pool.sort((a,b)=>(b.t==='t')-(a.t==='t'));
    let n=m==='cardio'||m==='abs'?1:(i<2?2:1);
    if(!many&&i<2&&p.form==='competition'&&m!=='cardio')n=3;
    if(many&&i>=2)n=1;
    pool.slice(0,n).forEach(e=>{used.add(e.id);items.push(mkItem(e,p,pr))});
  });

function vProgress(){
  const p=S.p,cw=curWeight(),b=cw/((p.h/100)**2);

  const diff=cw-first,left=cw-p.tw;
  const total=S.hist.length,mins=S.hist.reduce((s,x)=>s+x.min,0),kc=S.hist.reduce((s,x)=>s+x.kcal,0);
  const bmiT=b<18.5?'Недостаток':b<25?'Норма':b<30?'Избыток':'Ожирение';
  const rate=p.goal==='gain'?.3:.6,weeks=Math.abs(left)>.3?Math.ceil(Math.abs(left)/rate):0;
  return header('Прогресс','Ваша динамика')+`
  <div class="card">
    <div class="row between"><div><div class="sec small" style="font-weight:600">ВЕС</div><div class="big">${cw.toFixed(1)}<span class="mid sec"> кг</span></div>
    <div class="small" style="color:${(p.goal==='gain'?diff>=0:diff<=0)?'var(--green)':'var(--orange)'};font-weight:600">${diff>0?'+':''}${diff.toFixed(1)} кг с начала</div></div>
    <button class="pill" style="color:var(--blue)" data-act="addWeight">＋ Записать</button></div>
    ${chart()}
    <div class="row between small sec"><span>Цель: ${p.tw} кг</span><span>${weeks?`≈ ${weeks} нед. до цели`:'Цель достигнута 🎉'}</span></div>
  </div>
  <div class="grid2">
    <div class="card stat" style="margin:0"><div class="l">Серия дней</div><div class="n" style="color:var(--orange)">${streak()} 🔥</div></div>
    <div class="card stat" style="margin:0"><div class="l">ИМТ · ${bmiT}</div><div class="n">${b.toFixed(1)}</div></div>
    <div class="card stat" style="margin:0"><div class="l">Тренировок</div><div class="n" style="color:var(--move)">${total}</div></div>
    <div class="card stat" style="margin:0"><div class="l">Минут · ккал</div><div class="n" style="color:var(--exer)">${mins}<span class="small sec"> · ${kc.toLocaleString('ru-RU')}</span></div></div>
  </div>
  <h2>История</h2>
  ${S.hist.length?`<div class="list">${S.hist.slice().reverse().slice(0,30).map(h=>`<div class="li"><div class="ic ${LOC[h.loc]?LOC[h.loc].g:'g-blue'}">${LOC[h.loc]?LOC[h.loc].e:'🏋️'}</div><div class="body"><div class="t">${esc(h.name)}</div><div class="s">${new Date(h.d).toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${h.sets} подх.</div></div><div class="v small">${h.min} мин<br>${h.kcal} ккал</div></div>`).join('')}</div>`
  :`<div class="card empty"><div style="font-size:44px">🏁</div><h3 style="color:var(--text);margin:8px 0 4px">Пока пусто</h3>Завершите первую тренировку — она появится здесь.</div>`}`;
}
function chart(){
  const pts=S.weights.slice(-30);
  if(pts.length<2)return `<div class="empty small" style="padding:24px 8px">Добавьте хотя бы два замера, чтобы увидеть график.</div>`;
  const W=600,H=170,pad=14;
  const vals=pts.map(x=>x.w).concat([S.p.tw]);
  let mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;
  const X=i=>pad+i*(W-2*pad)/(pts.length-1),Y=v=>pad+(mx-v)*(H-2*pad)/(mx-mn);
  const line=pts.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(x.w).toFixed(1)}`).join('');
  const area=line+`L${X(pts.length-1)},${H}L${X(0)},${H}Z`;
  const ty=Y(S.p.tw);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity=".35"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>
  <line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--green)" stroke-dasharray="6 6" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  ${pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="4" fill="var(--blue)"/>`).join('')}</svg>`;
}

/* ============ SHEETS / ALERTS ============ */
function openSheet(title,html,keep){
  const st=$('#sheet').scrollTop;
  $('#sheet').innerHTML=`<div class="grab"></div><div class="sh"><h3>${title}</h3><button class="xbtn" data-act="closeSheet">✕</button></div><div class="sbody">${html}</div>`;
  $('#sheet').scrollTop=keep&&$('#sheet').classList.contains('on')?st:0;
  requestAnimationFrame(()=>{$('#backdrop').classList.add('on');$('#sheet').classList.add('on')});
}
function closeSheet(){S.adminOpen=false;$('#backdrop').classList.remove('on');$('#sheet').classList.remove('on')}
function alertBox(title,text,btns){
  $('#alert').innerHTML=`<div class="box"><div class="bt"><b>${title}</b><p>${text}</p></div>${btns.map((b,i)=>`<button class="ab ${b.cls||''}" data-ai="${i}">${b.t}</button>`).join('')}</div>`;
  $('#alert').classList.add('on');
  $('#alert').onclick=e=>{const b=e.target.closest('[data-ai]');if(!b)return;$('#alert').classList.remove('on');const f=btns[+b.dataset.ai].f;f&&f()};
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1800)}

/* ============ PLAYER ============ */
let P=null,AC=null;
function beep(f=880,d=.15){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function startWorkout(w){
  if(!w||!w.items.length){toast('Нет упражнений для этого места');return}
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}
  closeSheet();
  P={w,i:0,set:1,phase:'work',t0:Date.now(),end:0,paused:0,running:false,sets:0};
  clearInterval(P.iv);P.iv=setInterval(tick,200);
  $('#player').classList.add('on');document.body.style.overflow='hidden';
  renderPlayer();
}
function cur(){return P.w.items[P.i]}
function renderPlayer(){
  if(!P)return;
  const it=cur(),e=EXM[it.id],m=MUS[e.m],tot=P.w.items.length;
  const bar=P.w.items.map((_,i)=>`<i class="${i<P.i?'d':i===P.i?'c':''}"></i>`).join('');
  let main,ctrl;
  if(P.phase==='done'){
    const min=Math.max(1,Math.round((Date.now()-P.t0)/60000)),kc=kcalOf(min,P.w,S.p);
    P.result={min,kc};
    main=`<div style="font-size:80px">🏆</div><div class="nm">Тренировка завершена!</div><div class="ptip">${esc(P.w.title)}</div>
    <div class="grid3" style="width:100%;margin-top:24px;color:#fff">${[['Время',min+' мин','#A6FF00'],['Подходы',P.sets,'#00F0FF'],['Энергия',kc+' ккал','#FA114F']].map(([l,v,c])=>`<div style="background:#1C1C1E;border-radius:16px;padding:14px"><div style="font-size:13px;color:rgba(255,255,255,.6);font-weight:600">${l}</div><div style="font-size:22px;font-weight:700;color:${c}">${v}</div></div>`).join('')}</div>`;
    ctrl=`<button class="btn pgo" data-p="finish">Сохранить</button>`;
  }else if(P.phase==='rest'){
    const nx=P.set===1?EXM[it.id]:null;
    main=`<div class="k">Отдых</div>${pring('#00F0FF')}<div class="ptip">${nx?'Далее: <b style="color:#fff">'+esc(nx.n)+'</b>':'Подход '+P.set+' из '+it.sets+' · '+esc(e.n)}</div>`;
    ctrl=`<button class="btn pbtn2" data-p="add15">+15 с</button><button class="btn white" data-p="skipRest">Пропустить</button>`;
  }else{
    const isT=!!it.time;
    main=`<div class="k">Упражнение ${P.i+1} из ${tot}${it.sets>1?' · подход '+P.set+' из '+it.sets:''}</div>
    <div class="nm">${esc(e.n)}</div>
    ${isT?pring('#A6FF00'):`<div class="pemoji" style="background:${m.c}">${m.e}</div><div class="huge">${esc(it.reps)}</div><div class="k" style="text-transform:none">повторений</div>`}
    <div class="ptip" style="margin-top:8px">${esc(e.steps[0])}. ${esc(e.tip)}</div>`;
    ctrl=isT?`<button class="btn pbtn2" data-p="skip">Пропустить</button><button class="btn pgo" data-p="toggle">${P.running?'Пауза':'Старт'}</button>`
            :`<button class="btn pbtn2" data-p="skip">Пропустить</button><button class="btn pgo" data-p="doneSet">Готово ✓</button>`;
  }
  $('#player').innerHTML=`<div class="top"><button class="xbtn" style="background:rgba(255,255,255,.14);color:#fff" data-p="close">✕</button><div class="clock" id="pclock">${clock()}</div><button class="xbtn" style="background:rgba(255,255,255,.14);color:#fff" data-p="info" ${P.phase==='done'?'disabled style="opacity:0"':''}>i</button></div>
  <div class="pbar">${bar}</div><div class="pmain fade">${main}</div><div class="pctrl">${ctrl}</div>`;
  updRing();
}
function pring(col){const c=2*Math.PI*108;return `<div class="pring"><svg width="240" height="240"><circle cx="120" cy="120" r="108" fill="none" stroke="${col}" stroke-opacity=".2" stroke-width="16"/><circle id="pr" cx="120" cy="120" r="108" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="0"/></svg><div class="c"><div class="huge" id="pt">0:00</div></div></div>`}
function clock(){const s=Math.floor((Date.now()-P.t0)/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function leftSec(){return P.running?Math.max(0,(P.end-Date.now())/1000):P.paused}
function updRing(){
  const el=$('#pt'),pr=$('#pr');if(!el)return;
  const it=cur(),total=P.phase==='rest'?P.restTotal:it.time;
  const l=leftSec();el.textContent=fmtClock(Math.ceil(l));
  const c=2*Math.PI*108;pr.setAttribute('stroke-dashoffset',c*(1-l/total));
}
const fmtClock=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function tick(){
  if(!P)return;const c=$('#pclock');if(c&&P.phase!=='done')c.textContent=clock();
  if(!P.running)return;
  const l=leftSec();updRing();
  if(l<=3.2&&l>0&&Math.ceil(l)!==P.lastBeep){P.lastBeep=Math.ceil(l);beep(660,.08)}
  if(l<=0){P.running=false;beep(1040,.3);vib([120,60,120]);
    if(P.phase==='rest'){P.phase='work';const it=cur();if(it.time){P.paused=it.time}renderPlayer()}
    else completeSet()}
}
function startTimer(sec){P.end=Date.now()+sec*1000;P.running=true;P.lastBeep=null}
function completeSet(){
  const it=cur();P.sets++;
  if(P.set<it.sets){P.set++;rest(it.rest)}
  else if(P.i<P.w.items.length-1){P.i++;P.set=1;rest(it.rest)}
  else{P.phase='done';P.running=false;beep(1320,.4);renderPlayer()}
}
function rest(sec){P.phase='rest';P.restTotal=sec;startTimer(sec);renderPlayer()}
function playerAct(a){
  const it=cur();
  if(a==='toggle'){if(P.running){P.paused=leftSec();P.running=false}else{startTimer(P.paused||it.time)}renderPlayer()}
  else if(a==='doneSet'){vib(30);completeSet()}
  else if(a==='skip'){P.running=false;P.set=it.sets;completeSetSkip()}
  else if(a==='add15'){P.end+=15000;P.restTotal+=15;updRing()}
  else if(a==='skipRest'){P.running=false;P.phase='work';if(cur().time)P.paused=cur().time;renderPlayer()}
  else if(a==='info'){sheetExerciseOverPlayer(it.id)}
  else if(a==='close'){
    if(P.phase==='done'){finish(true);return}
    alertBox('Завершить тренировку?',P.sets?'Выполнено подходов: '+P.sets:'Прогресс не будет сохранён',[
      ...(P.sets?[{t:'Сохранить и выйти',cls:'b',f:()=>{const min=Math.max(1,Math.round((Date.now()-P.t0)/60000));P.result={min,kc:kcalOf(min,P.w,S.p)};finish(true)}}]:[]),
      {t:'Выйти без сохранения',cls:'r',f:()=>finish(false)},{t:'Продолжить'}]);
  }
  else if(a==='finish')finish(true);
}
function completeSetSkip(){
  if(P.i<P.w.items.length-1){P.i++;P.set=1;P.phase='work';if(cur().time)P.paused=cur().time;renderPlayer()}
  else{P.phase='done';renderPlayer()}
}
function sheetExerciseOverPlayer(id){P.paused=leftSec();P.running=false;renderPlayer();sheetExercise(id);$('#sheet').style.zIndex=55;$('#backdrop').style.zIndex=54;
  const b=$('#sheet [data-single]');if(b)b.remove()}
function finish(saveIt){
  if(saveIt&&P.result&&P.sets){
    S.hist.push({d:new Date().toISOString(),name:P.w.title,loc:P.w.loc,min:P.result.min,kcal:P.result.kc,sets:P.sets});
    if(P.w.plan&&P.phase==='done')S.planIdx++;
    if(BE.me){BE.saveMe({log:(BE.me.log||[]).concat([[Date.now(),P.result.min,P.result.kc]]).slice(-300)})}
    save();toast('Тренировка сохранена 💪');
  }
  clearInterval(P.iv);P=null;
  $('#player').classList.remove('on');document.body.style.overflow='';
  render();
}

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
const BE={kind:null,uid:null,players:{},ready:false,stale:false,err:null,isOwner:false,readOnly:false,ver:0,fbAll:null,pending:false,
  async init(){
    try{
      if(window.claude&&typeof window.claude.use==='function'){
        const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
        if(db&&user){const uid=await user.id();
          if(uid){this.db=db;this.user=user;this.uid=String(uid);this.kind='artifact';
            try{this.isOwner=!!user.isOwner()}catch(e){}
            try{const c=await user.can('data.write');if(c===false)this.readOnly=true}catch(e){}
            this.watchArtifact();onBE();return}}
      }
    }catch(e){}
    const C=window.FORMA_CONFIG||{};
    if(C.supabaseUrl&&C.supabaseKey){try{await this.initSupabase(C);return}catch(e){console.warn('Supabase',e)}}
    this.kind='none';this.ready=true;onBE();
  },
  watchArtifact(){
    const t=setTimeout(()=>{if(!this.ready){this.stale=true;onBE()}},10000);
    this.db.collection('players').onSnapshot(s=>{
      clearTimeout(t);const m={};s.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});
      this.players=m;this.ready=true;this.stale=false;this.ver++;onBE();
    },e=>{clearTimeout(t);this.err=e&&e.code||'error';this.ready=true;onBE()});
  },
  async initSupabase(C){
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
    const sb=window.supabase.createClient(C.supabaseUrl,C.supabaseKey);
    const g=await sb.auth.getSession();let ses=g.data&&g.data.session;
    if(!ses){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;ses=r.data.session}
    this.sb=sb;this.uid=ses.user.id;this.kind='supabase';
    const pull=async()=>{const r=await sb.from('players').select('id,data');
      if(r.error){this.stale=true;onBE();return}
      const m={};r.data.forEach(x=>m[x.id]=x.data);this.players=m;this.ready=true;this.stale=false;this.ver++;onBE()};
    await pull();setInterval(pull,20000);
    try{sb.channel('players-live').on('postgres_changes',{event:'*',schema:'public',table:'players'},()=>pull()).subscribe()}catch(e){}
  },
  get me(){return this.uid&&this.players[this.uid]||null},
  _q:Promise.resolve(),
  saveMe(patch){
    const cur=Object.assign({},this.players[this.uid]||{},patch,{upd:Date.now()});
    this.players=Object.assign({},this.players,{[this.uid]:cur});this.ver++;onBE();
    const data=JSON.parse(JSON.stringify(cur));
    this._q=this._q.then(()=>this.kind==='artifact'?this.db.doc('players/'+this.uid).set(data)
      :this.sb.from('players').upsert({id:this.uid,data,updated_at:new Date().toISOString()}).then(r=>{if(r.error)throw r.error}))
      .catch(e=>{toast(e&&e.code==='invalid_argument'?'Нет прав на запись — попросите доступ «Участник»':e&&e.code==='quota_exceeded'?'Хранилище клуба заполнено':'Не удалось сохранить — проверьте связь')});
    return this._q;
  },
  async sendFeedback(entry){
    if(this.kind==='artifact'){
      const ref=this.db.doc('feedback/'+this.uid);const s=await ref.get();
      const d=s.exists?JSON.parse(JSON.stringify(s.data())):{items:[]};
      if(entry.contact)d.contact=entry.contact;
      if(entry.item)d.items=(d.items||[]).concat([entry.item]).slice(-100);
      d.nick=(this.me&&this.me.nick)||S.p.name||'';d.upd=Date.now();
      await ref.set(d);return;
    }
    if(this.kind==='supabase'){const r=await this.sb.from('feedback').insert({data:entry});if(r.error)throw r.error;return}
    throw new Error('offline');
  },
  watchFeedback(cb){
    if(this.kind!=='artifact')return cb();
    if(this._fb){return cb()}
    this._fb=this.db.collection('feedback').onSnapshot(s=>{this.fbAll=s.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));cb()},()=>{this.fbAll=[];cb()});
  }
};

let MEMO={v:-1};
function memo(k,f){if(MEMO.v!==BE.ver)MEMO={v:BE.ver};return k in MEMO?MEMO[k]:(MEMO[k]=f())}
const PL=id=>BE.players[id];
function sumLog(pl,metric,from,to){let s=0;for(const x of (pl&&pl.log)||[]){if(x[0]>=from&&x[0]<=to)s+=metric==='workouts'?1:metric==='minutes'?(x[1]||0):metric==='kcal'?(x[2]||0):0}return s}
function collect(kind){return memo('c'+kind,()=>{const r=[];for(const [oid,pl] of Object.entries(BE.players))(pl[kind]||[]).forEach(x=>r.push(Object.assign({},x,{owner:oid,key:oid+':'+x.id})));return r})}
function membersOf(x){return [x.owner].concat((x.inv||[]).filter(id=>PL(id)&&(PL(id).acc||[]).includes(x.key)))}
function betState(b){return memo('b'+b.key,()=>{
  const ms=membersOf(b),vals={};
  ms.forEach(id=>{vals[id]=b.metric==='custom'?((PL(id).done||[]).includes(b.key)?1:0):sumLog(PL(id),b.metric,b.start,b.end)});
  const ended=Date.now()>b.end;let winners=[];
  if(b.mode==='most'){const mx=Math.max(0,...Object.values(vals));winners=mx>0?ms.filter(id=>vals[id]===mx):[]}
  else{const t=b.metric==='custom'?1:b.target;winners=ms.filter(id=>vals[id]>=t)}
  const N=ms.length,net={};
  if(ended&&N>=2){if(!winners.length||winners.length===N)ms.forEach(id=>net[id]=0);
    else ms.forEach(id=>net[id]=winners.includes(id)?Math.floor(b.stake*N/winners.length)-b.stake:-b.stake)}
  return {ms,vals,winners,ended,net,N};
})}
function goalState(g){return memo('g'+g.key,()=>{
  const ms=membersOf(g),vals={};ms.forEach(id=>vals[id]=sumLog(PL(id),g.metric,g.start,g.end));
  const total=Object.values(vals).reduce((a,b)=>a+b,0);
  return {ms,vals,total,done:total>=g.target,ended:Date.now()>g.end};
})}
function referrals(id){return memo('r'+id,()=>{const c=PL(id)&&PL(id).code;return c?Object.keys(BE.players).filter(k=>k!==id&&PL(k).ref===c):[]})}
function refValid(id){const pl=PL(id);return !!(pl&&pl.ref&&Object.keys(BE.players).some(k=>k!==id&&PL(k).code===pl.ref))}
function points(id){return memo('p'+id,()=>{
  const pl=PL(id);if(!pl)return 0;const L=pl.log||[];
  let p=L.length*20+L.reduce((s,x)=>s+(x[1]||0),0);
  if(refValid(id))p+=300;
  referrals(id).forEach(r=>{p+=200+((PL(r).log||[]).length?300:0)});
  collect('bets').forEach(b=>{const st=betState(b);if(st.net[id]!=null)p+=st.net[id]});
  collect('goals').forEach(g=>{const st=goalState(g);if(st.done&&st.ms.includes(id))p+=250});
  return Math.max(0,Math.round(p));
})}
function reserved(id){return collect('bets').reduce((s,b)=>{const st=betState(b);return s+(!st.ended&&st.ms.includes(id)?b.stake:0)},0)}
const available=id=>Math.max(0,points(id)-reserved(id));
function levelOf(p){let i=0;XPL.forEach((l,k)=>{if(p>=l[0])i=k});return {i,cur:XPL[i],next:XPL[i+1]}}
function isFriend(id){const me=BE.me,o=PL(id);return !!(me&&o&&id!==BE.uid&&(me.friends||[]).includes(id)&&(o.friends||[]).includes(BE.uid))}

function incoming(){const me=BE.me;if(!me)return [];return Object.keys(BE.players).filter(id=>id!==BE.uid&&(PL(id).friends||[]).includes(BE.uid)&&!(me.friends||[]).includes(id)&&!(me.fdec||[]).includes(id))}
function invitesOf(kind){const me=BE.me;if(!me)return [];return collect(kind).filter(x=>(x.inv||[]).includes(BE.uid)&&!(me.acc||[]).includes(x.key)&&!(me.dec||[]).includes(x.key)&&Date.now()<x.end)}

function radar(me,ids){
  const c=150,R=128,rad=d=>R*Math.min(1,Math.log10(1+d)/Math.log10(51));
  const rings=[1,5,20,50].map(k=>`<circle cx="${c}" cy="${c}" r="${rad(k)}" fill="none" stroke="var(--sep)"/><text x="${c+4}" y="${c-rad(k)+12}" font-size="10" fill="var(--sec)">${k} км</text>`).join('');
  const dots=ids.map(id=>{const L=PL(id).loc,d=km(me.lat,me.lng,L.lat,L.lng),br=Math.atan2((L.lng-me.lng)*Math.cos(me.lat*Math.PI/180),L.lat-me.lat),r=Math.max(42,rad(d)),x=c+r*Math.sin(br),y=c-r*Math.cos(br);
    return `<g data-player="${id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="16" fill="var(--card2)" stroke="var(--green)" stroke-width="2"/><text x="${x}" y="${y+6}" font-size="17" text-anchor="middle">${PL(id).ava||'🙂'}</text><text x="${x}" y="${y+30}" font-size="11" font-weight="600" text-anchor="middle" fill="var(--text)">${nm(id)}</text></g>`}).join('');
  return `<svg class="radar" viewBox="0 0 300 300">${rings}<circle cx="${c}" cy="${c}" r="8" fill="var(--blue)" stroke="#fff" stroke-width="3"/>${dots}</svg><p class="note" style="text-align:center;margin-top:6px">Друзья рядом с вами</p>`;
}

    if(a==='bip'&&S._bip){S._bip.prompt();S._bip=null;closeSheet()}
    if(a==='reonb'){O={step:1,p:Object.assign({},S.p)};renderOnb()}
    if(a==='reset')alertBox('Сбросить все данные?','Профиль, история тренировок и замеры будут удалены.',[{t:'Сбросить',cls:'r b',f:()=>{S.p=null;S.weights=[];S.hist=[];S.planIdx=0;save();try{['profile','weights','history','planIdx'].forEach(k=>localStorage.removeItem('forma.'+k))}catch(e){}render()}},{t:'Отмена'}]);
  }
});
function resetZ(){$('#sheet').style.zIndex='';$('#backdrop').style.zIndex=''}
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-pf]');if(!el)return;
  const k=el.dataset.pf;let v=el.value;
  if(['age','h','w','tw','level','days'].includes(k)){v=parseFloat(String(v).replace(',','.'));if(isNaN(v))return;}
  if(k==='age')v=Math.min(90,Math.max(14,Math.round(v)));
  S.p[k]=v;
  if(k==='w'){S.weights.push({d:new Date().toISOString(),w:v})}
  if(k==='loc')S.todayLoc=null;
  save();
  if(k!=='name'){render();toast('Программа пересчитана')}
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-pf="name"]');if(el){S.p.name=el.value;save();const a=document.querySelector('.hdr .avatar');if(a)a.textContent=(el.value||'Я')[0].toUpperCase()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();resetZ()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(ROUTES.includes(h)&&h!==S.tab){S.tab=h;render()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S._bip=e});
(function init(){
  const h=location.hash.slice(1);if(ROUTES.includes(h))S.tab=h;
  render();
  BE.init();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
})();
</script>
</body>
</html>
